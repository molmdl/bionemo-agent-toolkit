name: OpenCode Port Sync Check

on:
  pull_request:
    paths:
      - "plugins/bionemo-agent-toolkit/skills/**"
      - "scripts/opencode/**"
      - "opencode/**"
      - ".github/workflows/opencode-sync-check.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/bionemo-agent-toolkit/skills/**"
      - "scripts/opencode/**"
      - "opencode/**"
      - ".github/workflows/opencode-sync-check.yml"
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate OpenCode artifacts
        run: bash scripts/opencode/sync_upstream.sh

      - name: Verify generated artifacts are committed
        run: |
          mapfile -t GENERATED_FILES < <(python3 scripts/opencode/generate_opencode_port.py --print-generated-files)
          git diff -- "${GENERATED_FILES[@]}"
          git diff --quiet -- "${GENERATED_FILES[@]}"
